name: CI

# Checks every push and pull request: types, unit/component/conformance tests, generated files,
# and a smoke test of the built site in a real browser.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run check:site
      - run: npm test
      - name: Generated files are up to date
        run: |
          npm run catalog:check
          npm run build:skill
          git diff --exit-code -- components/parsons/skills/create-puzzle-json/validate.mjs
      - name: Validate example puzzle files
        run: |
          node components/parsons/core/cli.ts components/parsons/examples/mixed.json
          node components/parsons/core/cli.ts site/static/demos/reveal/puzzles.json
      - run: npm run build
        env:
          BASE_PATH: /component_lib
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
